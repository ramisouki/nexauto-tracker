:root {
  --bg: #03062b;
  --surface: #080d35;
  --surface2: #0d1340;
  --surface3: #111848;
  --border: #ffffff12;
  --border2: #ffffff1e;
  --text: #f0f0f5;
  --muted: #6b7db3;
  --accent: #00dbfc;

  --service: #85b8cc;
  --green: #4ade80;
  --red: #ff6b6b;
  --orange: #fb923c;

* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; min-height: 100vh; font-size: 14px; }

/* LOADING */
.loading-screen { position: fixed; inset: 0; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; z-index: 999; }
.loading-screen.hidden { display: none; }
.loading-logo { font-family: 'Inter', sans-serif; font-size: 24px; font-weight: 800; }
.loading-bar { width: 200px; height: 2px; background: var(--border2); border-radius: 2px; overflow: hidden; }
.loading-bar-inner { height: 100%; background: var(--accent); animation: loadbar 1.5s ease-in-out infinite; }
@keyframes loadbar { 0%{width:0;margin-left:0} 50%{width:100%;margin-left:0} 100%{width:0;margin-left:100%} }
.loading-text { font-family: 'Inter', monospace; font-size: 12px; color: var(--muted); }

/* HEADER */
header { display: flex; align-items: center; justify-content: space-between; padding: 18px 28px; border-bottom: 1px solid var(--border); background: var(--surface); position: sticky; top: 0; z-index: 100; }
.logo { font-family: 'Inter', sans-serif; font-weight: 800; font-size: 18px; letter-spacing: -0.5px; display: flex; align-items: center; gap: 10px; }
.logo-dot { width: 8px; height: 8px; background: var(--accent); border-radius: 50%; display: inline-block; }
.header-right { display: flex; align-items: center; gap: 12px; }
.sync-status { font-family: 'Inter', monospace; font-size: 11px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.sync-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); }
.sync-dot.live { background: #22c55e; box-shadow: 0 0 6px #22c55e88; }
.sync-dot.syncing { background: var(--accent); animation: pulse 1s infinite; }
.sync-dot.error { background: #ff6b6b; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
@keyframes spin { to { transform: rotate(360deg); } }
.btn { padding: 8px 16px; border-radius: 8px; border: 1px solid var(--border2); background: var(--surface2); color: var(--text); font-family: 'Inter', sans-serif; font-size: 13px; cursor: pointer; transition: all 0.15s; display: flex; align-items: center; gap: 6px; }
.btn:hover { background: var(--border2); }

/* TABS */
.tabs { display: flex; gap: 2px; padding: 16px 28px 0; background: var(--surface); border-bottom: 1px solid var(--border); }
.tab { padding: 10px 20px; font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 600; cursor: pointer; border-radius: 8px 8px 0 0; color: var(--muted); border: 1px solid transparent; border-bottom: none; transition: all 0.15s; }
.tab:hover { color: var(--text); }
.tab.active-warranty { color: var(--warranty); border-color: var(--border2); background: var(--surface2); border-bottom: 2px solid var(--warranty); }
.tab.active-service { color: var(--service); border-color: var(--border2); background: var(--surface2); border-bottom: 2px solid var(--service); }
.tab.overview { }
.tab.active-overview { color: var(--accent); border-color: var(--border2); background: var(--surface2); border-bottom: 2px solid var(--accent); }

/* FILTERS */
.filters { display: flex; align-items: center; gap: 10px; padding: 14px 28px; border-bottom: 1px solid var(--border); background: var(--surface); flex-wrap: wrap; }
.search-box { display: flex; align-items: center; gap: 8px; background: var(--surface2); border: 1px solid var(--border2); border-radius: 8px; padding: 7px 12px; flex: 1; min-width: 180px; }
.search-box input { background: none; border: none; color: var(--text); font-family: 'Inter', sans-serif; font-size: 13px; outline: none; width: 100%; }

select { background: var(--surface2); border: 1px solid var(--border2); border-radius: 8px; color: var(--text); padding: 7px 12px; font-family: 'Inter', sans-serif; font-size: 13px; cursor: pointer; outline: none; }
select option { background: #18181f; }

/* CONTENT */

/* KPI GRID */
.kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 24px; }
.kpi-card { background: var(--surface); border: 1px solid var(--border2); border-radius: 12px; padding: 18px 20px; display: flex; flex-direction: column; gap: 6px; }

.kpi-value { font-family: 'Inter', sans-serif; font-size: 26px; font-weight: 800; }
.kpi-sub { font-size: 11px; color: var(--muted); }

.kpi-tag.up { background: #4ade8020; color: #4ade80; }
.kpi-tag.down { background: #ff6b6b20; color: #ff6b6b; }

/* OVERVIEW GRID */

.overview-card { background: var(--surface); border: 1px solid var(--border2); border-radius: 12px; padding: 20px; }

.overview-kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.mini-kpi { display: flex; flex-direction: column; gap: 4px; }
.mini-kpi-label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.7px; font-family: 'Inter', monospace; }
.mini-kpi-value { font-family: 'Inter', sans-serif; font-size: 20px; font-weight: 700; }

/* TABLE */
.table-section { background: var(--surface); border: 1px solid var(--border2); border-radius: 12px; overflow: hidden; }
.table-header { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }

table { width: 100%; border-collapse: collapse; min-width: 900px; }
thead th { padding: 10px 14px; text-align: left; font-family: 'Inter', monospace; font-size: 10px; text-transform: uppercase; letter-spacing: 0.8px; color: var(--muted); border-bottom: 1px solid var(--border); white-space: nowrap; cursor: pointer; }
thead th:hover { color: var(--text); }
tbody tr { border-bottom: 1px solid var(--border); transition: background 0.1s; }
tbody tr:hover { background: var(--surface2); }
td { padding: 11px 14px; vertical-align: middle; white-space: nowrap; font-size: 13px; }

/* Toast */
.toast { position: fixed; bottom: 28px; right: 28px; background: var(--surface); border: 1px solid var(--border2); border-radius: 10px; padding: 12px 18px; font-size: 13px; z-index: 500; display: flex; align-items: center; gap: 8px; transform: translateY(80px); opacity: 0; transition: all 0.3s; }

// ─── AUTH ─────────────────────────────────────────────────────
async function getAccessToken() {
  if (accessToken && Date.now() < tokenExpiry - 60000) return accessToken;
  const now = Math.floor(Date.now() / 1000);
  const header = { alg: 'RS256', typ: 'JWT' };
  const claim = { iss: CLIENT_EMAIL, scope: 'https://www.googleapis.com/auth/spreadsheets', aud: 'https://oauth2.googleapis.com/token', exp: now + 3600, iat: now };
  const b64 = s => btoa(unescape(encodeURIComponent(JSON.stringify(s)))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
  const unsigned = b64(header) + '.' + b64(claim);
  const sig = await signJWT(unsigned, PRIVATE_KEY);
  const jwt = unsigned + '.' + sig;
  const res = await fetch('https://oauth2.googleapis.com/token', { method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'}, body:`grant_type=urn%3Aietf%3Aparams%3Aoauth%3Agrant-type%3Ajwt-bearer&assertion=${jwt}` });
  const data = await res.json();
  if (!data.access_token) throw new Error('Auth failed: ' + JSON.stringify(data));
  accessToken = data.access_token;
  tokenExpiry = Date.now() + (data.expires_in * 1000);
  return accessToken;
}

async function signJWT(data, pemKey) {
  const sig = new KJUR.crypto.Signature({ alg: 'SHA256withRSA' });
  sig.init(pemKey);
  sig.updateString(data);
  const hex = sig.sign();
  const bytes = new Uint8Array(hex.match(/.{1,2}/g).map(b => parseInt(b, 16)));
  return btoa(String.fromCharCode(...bytes)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}

async function sheetsGet(range) {
  const token = await getAccessToken();
  const url = `https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/${encodeURIComponent(range)}`;
  const res = await fetch(url, { headers: { Authorization: `Bearer ${token}` } });
  if (!res.ok) throw new Error('Sheets read failed: ' + res.status);
  return res.json();
}

// ─── FILTERS ─────────────────────────────────────────────────
function populateFilters() {
  const data = activeTab === 'warranty' ? warrantyData : serviceData;
  const years = [...new Set(data.map(r => r.year).filter(Boolean))].sort();
  const statuses = [...new Set(data.map(r => r.status).filter(Boolean))].sort();
  const yf = document.getElementById('filterYear');
  const sf = document.getElementById('filterStatus');
  const curY = yf.value, curS = sf.value;
  yf.innerHTML = '<option value="">All Years</option>';
  years.forEach(y => { const o=document.createElement('option'); o.value=y; o.textContent=y; yf.appendChild(o); });
  yf.value = curY;
  sf.innerHTML = '<option value="">All Statuses</option>';
  statuses.forEach(s => { const o=document.createElement('option'); o.value=s; o.textContent=s; sf.appendChild(o); });
  sf.value = curS;
}

function getFilters() {
  return {
    search: (document.getElementById('searchInput')||{value:''}).value.toLowerCase(),
    year: (document.getElementById('filterYear')||{value:''}).value,
    month: (document.getElementById('filterMonth')||{value:''}).value,
    status: (document.getElementById('filterStatus')||{value:''}).value,
    payment: (document.getElementById('filterPayment')||{value:''}).value,
  };
}

function applyFilters(data) {
  const f = getFilters();
  return data.filter(r => {
    if (f.year && r.year != f.year) return false;
    if (f.month && r.month !== f.month) return false;
    if (f.status && r.status !== f.status) return false;
    if (f.payment && r.paymentStatus !== f.payment) return false;
    if (f.search) {
      const h = [r.customerName, r.customerMobile, r.make, r.model, r.plate, r.distributor].join(' ').toLowerCase();
      if (!h.includes(f.search)) return false;
    }
    return true;
  });
}

  activeTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.className = 'tab ' + t.className.split(' ').filter(c=>!c.startsWith('active')).join(' '));
  const el = document.querySelector(`.tab.${tab === 'overview' ? 'overview' : tab === 'warranty' ? 'warranty' : 'service'}`);
  if (el) el.classList.add(tab === 'overview' ? 'active-overview' : tab === 'warranty' ? 'active-warranty' : 'active-service');
  document.getElementById('filtersBar').style.display = tab === 'overview' ? 'none' : 'flex';
  if (tab !== 'overview') populateFilters();

// ─── HELPERS ─────────────────────────────────────────────────
function fmt(n) { return (n||0).toLocaleString('en-AE', {minimumFractionDigits:0, maximumFractionDigits:0}); }
function fmtDec(n) { return (n||0).toLocaleString('en-AE', {minimumFractionDigits:2, maximumFractionDigits:2}); }

function parseSheetDate(str) {
  if (!str) return null;
  // Try DD/MM/YYYY or D/M/YYYY
  const p = str.split('/');
  if (p.length === 3) {
    const y = parseInt(p[2]) < 100 ? 2000+parseInt(p[2]) : parseInt(p[2]);
    return new Date(y, parseInt(p[1])-1, parseInt(p[0]));
  }
  const d = new Date(str);
  return isNaN(d) ? null : d;
}

function daysUntil(dateStr) {
  const d = parseSheetDate(dateStr);
  if (!d) return null;
  const today = new Date(); today.setHours(0,0,0,0);
  return Math.round((d - today) / 86400000);
}

function statusBadge(s) {
  if (!s) return `<span class="badge badge-other">—</span>`;
  const l = s.toLowerCase();
  if (l.includes('active') || l === 'valid') return `<span class="badge badge-active">${s}</span>`;
  if (l.includes('expired') || l.includes('void')) return `<span class="badge badge-expired">${s}</span>`;
  if (l.includes('pending') || l.includes('processing')) return `<span class="badge badge-pending">${s}</span>`;
  if (l.includes('cancel')) return `<span class="badge badge-cancelled">${s}</span>`;
  return `<span class="badge badge-other">${s}</span>`;
}
function payBadge(s) {
  if (!s) return `<span class="badge badge-other">—</span>`;
  const l = s.toLowerCase();
  if (l === 'paid') return `<span class="badge badge-paid">Paid</span>`;
  if (l === 'unpaid' || l === 'outstanding') return `<span class="badge badge-unpaid">Unpaid</span>`;
  return `<span class="badge badge-pending">${s}</span>`;
}
function setSyncStatus(state, label) {
  document.getElementById('syncDot').className = 'sync-dot ' + state;
  document.getElementById('syncLabel').textContent = label;
}
function showToast(msg, type='error') {
  const t = document.getElementById('toast');
  t.textContent = '✕ ' + msg;
  t.className = `toast ${type} show`;
  setTimeout(() => t.className='toast', 3500);
}

function monthlyRevenue(data, revenueKey) {
  const totals = {};
  MONTHS.forEach(m => totals[m] = 0);
  data.forEach(r => { if (r.month && totals[r.month] !== undefined) totals[r.month] += r[revenueKey]||0; });
  return MONTHS.map(m => totals[m]);
}

function makeChart(id, type, labels, datasets, options={}) {
  const ctx = document.getElementById(id);
  if (!ctx) return;
  if (chartInstances[id]) { try { chartInstances[id].destroy(); } catch(e){} }
  chartInstances[id] = new Chart(ctx, {
    type,
    data: { labels, datasets },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { labels: { color: '#6b6b7e', font: { family: 'DM Sans', size: 11 }, boxWidth: 12 } } },
      scales: type !== 'doughnut' ? {
        x: { ticks: { color: '#6b6b7e', font: { size: 10 } }, grid: { color: '#ffffff08' } },
        y: { ticks: { color: '#6b6b7e', font: { size: 10 } }, grid: { color: '#ffffff08' } }
      } : {},
      ...options
    }
  });
}

// ─── EXPIRY HELPERS ───────────────────────────────────────────
function expiringWithin(data, endDateKey, days) {
  return data.filter(r => {
    const d = daysUntil(r[endDateKey]);
    return d !== null && d >= 0 && d <= days;
  }).length;
}

// ─── AI INSIGHTS ──────────────────────────────────────────────
async function generateInsights() {
  const el = document.getElementById('aiInsightsContent');
  if (!el) return;
  el.innerHTML = `<div style="width:16px;height:16px;border:2px solid var(--accent);border-top-color:transparent;border-radius:50%;animation:spin 0.8s linear infinite;flex-shrink:0"></div><span style="color:var(--muted);font-size:13px">Analyzing your contracts data...</span>`;

  // Build data summary for Claude
  const wTotal = warrantyData.length;
  const sTotal = serviceData.length;
  const wRevenue = warrantyData.reduce((s,r)=>s+r.price,0);
  const sRevenue = serviceData.reduce((s,r)=>s+r.sellingPrice,0);
  const wGP = warrantyData.reduce((s,r)=>s+r.grossProfit,0);
  const sGP = serviceData.reduce((s,r)=>s+r.grossProfit,0);

  // Expiry counts
  const exp30 = expiringWithin(warrantyData,'warrantyEnd',30) + expiringWithin(serviceData,'endDate',30);
  const exp60 = expiringWithin(warrantyData,'warrantyEnd',60) + expiringWithin(serviceData,'endDate',60);
  const exp90 = expiringWithin(warrantyData,'warrantyEnd',90) + expiringWithin(serviceData,'endDate',90);

  // Product GP%
  const productStats = {};
  warrantyData.forEach(r => {
    const k = r.planName||'Other';
    if (!productStats[k]) productStats[k] = {rev:0,gp:0,count:0};
    productStats[k].rev+=r.price; productStats[k].gp+=r.grossProfit; productStats[k].count++;
  });
  serviceData.forEach(r => {
    const k = r.contractType||'Other';
    if (!productStats[k]) productStats[k] = {rev:0,gp:0,count:0};
    productStats[k].rev+=r.sellingPrice; productStats[k].gp+=r.grossProfit; productStats[k].count++;
  });
  const productSummary = Object.entries(productStats).map(([k,v])=>
    `${k}: ${v.count} contracts, AED ${Math.round(v.rev)} revenue, ${v.rev?Math.round(v.gp/v.rev*100):0}% GP`
  ).join('\n');

  // Distributor stats
  const distStats = {};
  [...warrantyData,...serviceData].forEach(r => {
    const k = r.distributor||'Unknown';
    if (!distStats[k]) distStats[k] = {contracts:0,revenue:0,gp:0};
    distStats[k].contracts++;
    distStats[k].revenue += (r.price||0)+(r.sellingPrice||0);
    distStats[k].gp += r.grossProfit||0;
  });
  const distSummary = Object.entries(distStats).map(([k,v])=>
    `${k}: ${v.contracts} contracts, AED ${Math.round(v.revenue)} revenue, AED ${Math.round(v.gp)} GP`
  ).join('\n');

  // Monthly trend (last 3 months)
  const now = new Date();
  const recentMonths = [0,1,2].map(i => {
    const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
    return d.toLocaleString('en-GB',{month:'long'});
  });
  const monthlyTrend = recentMonths.map(m => {
    const wR = warrantyData.filter(r=>r.month===m).reduce((s,r)=>s+r.price,0);
    const sR = serviceData.filter(r=>r.month===m).reduce((s,r)=>s+r.sellingPrice,0);
    return `${m}: AED ${Math.round(wR+sR)} revenue`;
  }).join(', ');

  const prompt = `You are a business analyst for NexAuto.ae, a Dubai-based automotive service platform. Analyze this contracts data and provide exactly 4 concise, actionable bullet-point recommendations. Be specific with numbers. Focus on: expiry/renewal opportunities, product performance, distributor insights, and revenue trends.

DATA SUMMARY:
- Warranty Contracts: ${wTotal} total, AED ${Math.round(wRevenue)} revenue, AED ${Math.round(wGP)} GP (${wRevenue?Math.round(wGP/wRevenue*100):0}% margin)
- Service Contracts: ${sTotal} total, AED ${Math.round(sRevenue)} revenue, AED ${Math.round(sGP)} GP (${sRevenue?Math.round(sGP/sRevenue*100):0}% margin)
- Expiring soon: ${exp30} in 30 days, ${exp60} in 60 days, ${exp90} in 90 days
- Recent trend: ${monthlyTrend}

PRODUCT PERFORMANCE:
${productSummary}

DISTRIBUTOR PERFORMANCE:
${distSummary}

Respond with exactly 4 bullet points. Each bullet: one bold insight title (5 words max), then one sentence with specific numbers and a clear action. Format:
• **Title**: Insight sentence.`;

  try {
    const res = await fetch('https://nexauto-ai.rami-souki.workers.dev', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1000,
        messages: [{ role: 'user', content: prompt }]
      })
    });
    const data = await res.json();
    const text = data.content?.[0]?.text || '';

    // Parse bullet points
    const bullets = text.split('\n').filter(l => l.trim().startsWith('•') || l.trim().startsWith('-') || l.trim().match(/^\d\./));
    const rendered = bullets.map(b => {
      const clean = b.replace(/^[•\-\d\.]\s*/,'').trim();
      const withBold = clean.replace(/\*\*(.*?)\*\*/g, '<strong style="color:var(--accent)">$1</strong>');
      return `<div style="display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--border)">
        <div style="color:var(--accent);font-size:16px;line-height:1;flex-shrink:0;margin-top:1px">✦</div>
        <div style="font-size:13px;line-height:1.6;color:var(--text)">${withBold}</div>
      </div>`;
    }).join('');

    el.innerHTML = rendered || `<div style="color:var(--muted);font-size:13px">${text}</div>`;
  } catch(e) {
    el.innerHTML = `<div style="color:var(--red);font-size:13px">Could not generate insights. Check console for details.</div>`;
    console.error(e);
  }
}

// ─── INIT ─────────────────────────────────────────────────────
async function init() {
  document.getElementById('loadingScreen').classList.remove('hidden');
  document.getElementById('appShell').style.display = 'none';
  try {
    await loadData();
    document.getElementById('loadingScreen').classList.add('hidden');
    document.getElementById('appShell').style.display = 'block';
    renderOverview();
    generateInsights();
  } catch(e) {
    document.getElementById('loadingText').textContent = '✕ ' + e.message;
    showToast(e.message);
    console.error(e);
  }
}

init();
</script>
