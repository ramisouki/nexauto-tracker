<html lang="en">

<meta charset="UTF-8">

<title>NexAuto — Job Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #0a0a0f;
    --surface: #111118;
    --surface2: #18181f;
    --border: #ffffff0f;
    --border2: #ffffff18;
    --text: #f0f0f5;
    --muted: #6b6b7e;
    --accent: #e8ff47;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; min-height: 100vh; font-size: 14px; }

  header { display: flex; align-items: center; justify-content: space-between; padding: 18px 28px; border-bottom: 1px solid var(--border); background: var(--surface); position: sticky; top: 0; z-index: 100; }
  .logo { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 18px; letter-spacing: -0.5px; display: flex; align-items: center; gap: 10px; }
  .logo-dot { width: 8px; height: 8px; background: var(--accent); border-radius: 50%; display: inline-block; }
  .header-right { display: flex; align-items: center; gap: 12px; }
  .sync-status { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .sync-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); }
  .sync-dot.live { background: #22c55e; box-shadow: 0 0 6px #22c55e88; }
  .sync-dot.syncing { background: var(--accent); animation: pulse 1s infinite; }
  .sync-dot.error { background: #ff6b6b; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

  .btn { padding: 8px 16px; border-radius: 8px; border: 1px solid var(--border2); background: var(--surface2); color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 13px; cursor: pointer; transition: all 0.15s; display: flex; align-items: center; gap: 6px; }
  .btn:hover { background: var(--border2); }
  .btn-primary { background: var(--accent); color: #0a0a0f; border-color: var(--accent); font-weight: 600; }
  .btn-primary:hover { background: #d4eb3a; }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }

  .stats-bar { display: flex; gap: 1px; background: var(--border); border-bottom: 1px solid var(--border); }
  .stat-card { flex: 1; background: var(--surface); padding: 16px 20px; display: flex; flex-direction: column; gap: 4px; }
  .stat-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.8px; font-family: 'DM Mono', monospace; }
  .stat-value { font-family: 'Syne', sans-serif; font-size: 22px; font-weight: 700; }
  .stat-sub { font-size: 11px; color: var(--muted); }

  .toolbar { display: flex; align-items: center; gap: 10px; padding: 14px 28px; border-bottom: 1px solid var(--border); background: var(--surface); flex-wrap: wrap; }
  .search-box { display: flex; align-items: center; gap: 8px; background: var(--surface2); border: 1px solid var(--border2); border-radius: 8px; padding: 7px 12px; flex: 1; min-width: 200px; }
  .search-box input { background: none; border: none; color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 13px; outline: none; width: 100%; }
  .search-box input::placeholder { color: var(--muted); }
  select { background: var(--surface2); border: 1px solid var(--border2); border-radius: 8px; color: var(--text); padding: 7px 12px; font-family: 'DM Sans', sans-serif; font-size: 13px; cursor: pointer; outline: none; }
  select option { background: #18181f; }

  .overdue-banner { margin: 16px 28px; background: #ff474711; border: 1px solid #ff474733; border-radius: 10px; padding: 12px 16px; display: flex; align-items: center; gap: 10px; font-size: 13px; color: #ff9494; }
  .overdue-banner b { color: #ff6b6b; }

  .section-title { padding: 16px 28px 8px; font-family: 'Syne', sans-serif; font-size: 13px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; display: flex; align-items: center; gap: 8px; }
  .count-pill { background: var(--surface2); border: 1px solid var(--border2); border-radius: 20px; padding: 2px 8px; font-size: 11px; font-family: 'DM Mono', monospace; color: var(--muted); }

  .table-wrap { padding: 0 28px 40px; overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; min-width: 1100px; }
  thead th { padding: 10px 12px; text-align: left; font-family: 'DM Mono', monospace; font-size: 10px; text-transform: uppercase; letter-spacing: 0.8px; color: var(--muted); border-bottom: 1px solid var(--border); white-space: nowrap; cursor: pointer; user-select: none; }
  thead th:hover { color: var(--text); }
  tbody tr { border-bottom: 1px solid var(--border); transition: background 0.1s; }
  tbody tr:hover { background: var(--surface2); }
  tbody tr.overdue { background: #ff47471a; }
  tbody tr.overdue:hover { background: #ff474725; }
  td { padding: 11px 12px; vertical-align: middle; white-space: nowrap; }

  .status-select { border: none; cursor: pointer; font-family: 'DM Mono', monospace; font-size: 11px; font-weight: 500; padding: 3px 9px; border-radius: 20px; outline: none; }
  .s-wip { background: #3b82f620; color: #60a5fa; }
  .s-awaiting-approval { background: #f59e0b20; color: #fbbf24; }
  .s-awaiting-payment { background: #a78bfa20; color: #c4b5fd; }
  .s-awaiting-parts { background: #fb923c20; color: #fdba74; }
  .s-awaiting-estimate { background: #fb923c20; color: #fdba74; }
  .s-delivered { background: #22c55e20; color: #4ade80; }
  .s-review { background: #ec489920; color: #f472b6; }
  .s-ag { background: #0ea5e920; color: #38bdf8; }
  .s-aaa { background: #8b5cf620; color: #a78bfa; }
  .s-tabby { background: #14b8a620; color: #2dd4bf; }
  .s-diagnosis { background: #64748b20; color: #94a3b8; }
  .s-other { background: #6b728020; color: #9ca3af; }

  .car-make { font-weight: 500; }
  .car-plate { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--muted); }
  .customer-name { font-weight: 500; }
  .customer-mobile { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--muted); }
  .date-cell { font-family: 'DM Mono', monospace; font-size: 12px; color: var(--muted); }
  .date-overdue { color: #ff6b6b !important; font-weight: 600; }
  .center-name { font-size: 12px; padding: 2px 8px; border-radius: 4px; background: var(--border); color: var(--muted); font-family: 'DM Mono', monospace; }
  .action-btn { background: none; border: 1px solid var(--border2); color: var(--muted); border-radius: 6px; padding: 4px 8px; cursor: pointer; font-size: 12px; transition: all 0.15s; }
  .action-btn:hover { background: var(--surface2); color: var(--text); }

  /* Loading */
  .loading-screen { position: fixed; inset: 0; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; z-index: 999; }
  .loading-screen.hidden { display: none; }
  .loading-logo { font-family: 'Syne', sans-serif; font-size: 24px; font-weight: 800; }
  .loading-bar { width: 200px; height: 2px; background: var(--border2); border-radius: 2px; overflow: hidden; }
  .loading-bar-inner { height: 100%; background: var(--accent); animation: loadbar 1.5s ease-in-out infinite; }
  @keyframes loadbar { 0%{width:0;margin-left:0} 50%{width:100%;margin-left:0} 100%{width:0;margin-left:100%} }
  .loading-text { font-family: 'DM Mono', monospace; font-size: 12px; color: var(--muted); }

  /* Toast */
  .toast { position: fixed; bottom: 28px; right: 28px; background: var(--surface); border: 1px solid var(--border2); border-radius: 10px; padding: 12px 18px; font-size: 13px; z-index: 500; display: flex; align-items: center; gap: 8px; transform: translateY(80px); opacity: 0; transition: all 0.3s; }
  .toast.show { transform: translateY(0); opacity: 1; }
  .toast.success { border-color: #22c55e44; color: #4ade80; }
  .toast.error { border-color: #ff6b6b44; color: #ff9494; }

  /* MODAL */
  .modal-overlay { display: none; position: fixed; inset: 0; background: #00000088; z-index: 200; align-items: center; justify-content: center; backdrop-filter: blur(4px); }
  .modal-overlay.open { display: flex; }
  .modal { background: var(--surface); border: 1px solid var(--border2); border-radius: 16px; padding: 28px; width: 560px; max-width: 95vw; max-height: 90vh; overflow-y: auto; }
  .modal h2 { font-family: 'Syne', sans-serif; font-size: 18px; font-weight: 700; margin-bottom: 20px; }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .form-full { grid-column: 1 / -1; }
  .form-group { display: flex; flex-direction: column; gap: 5px; }
  .form-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.6px; font-family: 'DM Mono', monospace; }
  .form-input { background: var(--surface2); border: 1px solid var(--border2); border-radius: 8px; color: var(--text); padding: 9px 12px; font-family: 'DM Sans', sans-serif; font-size: 13px; outline: none; transition: border-color 0.15s; width: 100%; }
  .form-input:focus { border-color: var(--accent); }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--muted); }
  .empty-state h3 { font-family: 'Syne', sans-serif; font-size: 16px; margin-bottom: 8px; color: var(--text); }

// ─── JWT / AUTH ───────────────────────────────────────────────
async function getAccessToken() {
  if (accessToken && Date.now() < tokenExpiry - 60000) return accessToken;
  const now = Math.floor(Date.now() / 1000);
  const header = { alg: 'RS256', typ: 'JWT' };
  const claim = {
    iss: CLIENT_EMAIL,
    scope: 'https://www.googleapis.com/auth/spreadsheets',
    aud: 'https://oauth2.googleapis.com/token',
    exp: now + 3600,
    iat: now
  };
  const b64 = s => btoa(unescape(encodeURIComponent(JSON.stringify(s)))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
  const unsigned = b64(header) + '.' + b64(claim);
  const sig = await signJWT(unsigned, PRIVATE_KEY);
  const jwt = unsigned + '.' + sig;
  const res = await fetch('https://oauth2.googleapis.com/token', {
    method: 'POST',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: `grant_type=urn%3Aietf%3Aparams%3Aoauth%3Agrant-type%3Ajwt-bearer&assertion=${jwt}`
  });
  const data = await res.json();
  if (!data.access_token) throw new Error('Auth failed: ' + JSON.stringify(data));
  accessToken = data.access_token;
  tokenExpiry = Date.now() + (data.expires_in * 1000);
  return accessToken;
}

async function signJWT(data, pemKey) {
  const sig = new KJUR.crypto.Signature({ alg: 'SHA256withRSA' });
  sig.init(pemKey);
  sig.updateString(data);
  const hex = sig.sign();
  const bytes = new Uint8Array(hex.match(/.{1,2}/g).map(b => parseInt(b, 16)));
  return btoa(String.fromCharCode(...bytes)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}

// ─── SHEETS API ───────────────────────────────────────────────
async function sheetsGet(range) {
  const token = await getAccessToken();
  const url = `https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/${encodeURIComponent(range)}`;
  const res = await fetch(url, { headers: { Authorization: `Bearer ${token}` } });
  if (!res.ok) throw new Error('Sheets read failed: ' + res.status);
  return res.json();
}

async function sheetsUpdate(range, values) {
  const token = await getAccessToken();
  const url = `https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/${encodeURIComponent(range)}?valueInputOption=USER_ENTERED`;
  const res = await fetch(url, {
    method: 'PUT',
    headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' },
    body: JSON.stringify({ range, majorDimension: 'ROWS', values })
  });
  if (!res.ok) throw new Error('Sheets write failed: ' + res.status);
  return res.json();
}

async function sheetsAppend(values) {
  const token = await getAccessToken();
  const range = `${SHEET_NAME}!A:L`;
  const url = `https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/${encodeURIComponent(range)}:append?valueInputOption=USER_ENTERED&insertDataOption=INSERT_ROWS`;
  const res = await fetch(url, {
    method: 'POST',
    headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' },
    body: JSON.stringify({ range, majorDimension: 'ROWS', values })
  });
  if (!res.ok) throw new Error('Sheets append failed: ' + res.status);
  return res.json();
}

// ─── LOAD DATA ────────────────────────────────────────────────
async function loadFromSheet() {
  setSyncStatus('syncing', 'Syncing...');
  try {
    const data = await sheetsGet(`${SHEET_NAME}!A:L`);
    const rows = data.values || [];
    // Skip header row (row 0)
    jobs = rows.slice(1).map((row, i) => ({
      id: i + 2, // actual sheet row number (1-indexed, +1 for header)
      sheetRow: i + 2,
      status:        row[COL.status]        || '',
      receivingDate: row[COL.receivingDate] || '',
      name:          row[COL.name]          || '',
      mobile:        row[COL.mobile]        || '',
      make:          row[COL.make]          || '',
      model:         row[COL.model]         || '',
      plate:         row[COL.plate]         || '',
      jobType:       row[COL.jobType]       || '',
      serviceCenter: row[COL.serviceCenter] || '',
      partsETA:      row[COL.partsETA]      || '',
      carETD:        row[COL.carETD]        || '',
      comeBack:      row[COL.comeBack]      || '',
    })).filter(j => j.name || j.status);

    populateFilters();
    renderStats();
    renderTable();
    setSyncStatus('live', `Synced · ${new Date().toLocaleTimeString('en-GB', {hour:'2-digit',minute:'2-digit'})}`);
  } catch (err) {
    setSyncStatus('error', 'Sync failed');
    showToast('Could not load sheet: ' + err.message, 'error');
    console.error(err);
  }
}

// ─── WRITE BACK ───────────────────────────────────────────────
async function writeJobToSheet(job) {
  const row = Array(TOTAL_COLS).fill('');
  row[COL.status]        = job.status || '';
  row[COL.receivingDate] = job.receivingDate || '';
  row[COL.name]          = job.name || '';
  row[COL.mobile]        = job.mobile || '';
  row[COL.email]         = job.email || '';
  row[COL.make]          = job.make || '';
  row[COL.model]         = job.model || '';
  row[COL.plate]         = job.plate || '';
  row[COL.jobType]       = job.jobType || '';
  row[COL.serviceCenter] = job.serviceCenter || '';
  row[COL.partsETA]      = job.partsETA || '';
  row[COL.carETD]        = job.carETD || '';
  row[COL.comeBack]      = job.comeBack || '';
  row[COL.revenue]       = job.revenue !== null ? job.revenue : '';

  if (job.sheetRow) {
    const range = `${SHEET_NAME}!A${job.sheetRow}:N${job.sheetRow}`;
    await sheetsUpdate(range, [row]);
  } else {
    await sheetsAppend([row]);
  }
}

// ─── HELPERS ─────────────────────────────────────────────────
function parseDate(str) {
  if (!str || str === 'NA' || str === '') return null;
  const p = str.split('/');
  if (p.length !== 3) return null;
  const y = parseInt(p[2]) > 1000 ? parseInt(p[2]) : 2000 + parseInt(p[2]);
  return new Date(y, parseInt(p[1])-1, parseInt(p[0]));
}
function fmtDate(d) { if (!d) return ''; return d.toLocaleDateString('en-GB', {day:'2-digit',month:'short',year:'2-digit'}); }
function toInputDate(d) { if (!d) return ''; return d.toISOString().split('T')[0]; }
function fromInputDate(s) { if (!s) return null; return new Date(s); }
function fmtSheet(d) { if (!d) return ''; return `${d.getDate()}/${d.getMonth()+1}/${d.getFullYear()}`; }

function statusClass(s) {
  if (!s) return 's-other';
  const l = s.toLowerCase();
  if (l === 'wip') return 's-wip';
  if (l.includes('awaiting approval')) return 's-awaiting-approval';
  if (l.includes('awaiting payment')) return 's-awaiting-payment';
  if (l.includes('awaiting parts')) return 's-awaiting-parts';
  if (l.includes('awaiting estimate')) return 's-awaiting-estimate';
  if (l === 'delivered') return 's-delivered';
  if (l === 'review') return 's-review';
  if (l.includes('ag') || l.includes('autoguard')) return 's-ag';
  if (l.includes('aaa')) return 's-aaa';
  if (l === 'tabby') return 's-tabby';
  if (l === 'diagnosis') return 's-diagnosis';
  return 's-other';
}

function isOverdue(j) {
  if (j.status === 'Delivered') return false;
  const etd = parseDate(j.carETD);
  if (!etd) return false;
  const today = new Date(); today.setHours(0,0,0,0);
  return etd < today;
}

function setSyncStatus(state, label) {
  const dot = document.getElementById('syncDot');
  dot.className = 'sync-dot ' + state;
  document.getElementById('syncLabel').textContent = label;
}

function showToast(msg, type = 'success') {
  const t = document.getElementById('toast');
  t.textContent = (type === 'success' ? '✓ ' : '✕ ') + msg;
  t.className = `toast ${type} show`;
  setTimeout(() => t.className = 'toast', 3000);
}

function sortBy(key) {
  if (sortKey === key) sortDir *= -1; else { sortKey = key; sortDir = 1; }
  renderTable();
}

function populateFilters() {
  const sf = document.getElementById('filterStatus');
  const curStatus = sf.value;
  sf.innerHTML = '<option value="">All Statuses</option>';
  STATUSES.forEach(s => { const o = document.createElement('option'); o.value=s; o.textContent=s; sf.appendChild(o); });
  sf.value = curStatus;

  const tf = document.getElementById('filterType');
  const curType = tf.value;
  tf.innerHTML = '<option value="">All Job Types</option>';
  const jt = [...new Set(jobs.map(j=>j.jobType).filter(Boolean))].sort();
  jt.forEach(t => { const o = document.createElement('option'); o.value=t; o.textContent=t; tf.appendChild(o); });
  tf.value = curType;

  const mf = document.getElementById('fStatus');
  mf.innerHTML = '';
  STATUSES.forEach(s => { const o = document.createElement('option'); o.value=s; o.textContent=s; mf.appendChild(o); });
}

function getFiltered() {
  const search = document.getElementById('searchInput').value.toLowerCase();
  const status = document.getElementById('filterStatus').value;
  const center = document.getElementById('filterCenter').value;
  const type   = document.getElementById('filterType').value;
  const cb     = document.getElementById('filterComeback').value;
  return jobs.filter(j => {
    if (status && j.status !== status) return false;
    if (center && j.serviceCenter !== center) return false;
    if (type && j.jobType !== type) return false;
    if (cb && j.comeBack !== cb) return false;
    if (search) {
      const h = [j.name,j.mobile,j.make,j.model,j.plate,j.serviceCenter].join(' ').toLowerCase();
      if (!h.includes(search)) return false;
    }
    return true;
  }).sort((a,b) => {
    let va = a[sortKey]||'', vb = b[sortKey]||'';
    if (['receivingDate','carETD'].includes(sortKey)) { va=parseDate(va)||new Date(0); vb=parseDate(vb)||new Date(0); }
    return va<vb ? -sortDir : va>vb ? sortDir : 0;
  });
}

function renderStats() {
  const active    = jobs.filter(j=>j.status!=='Delivered').length;
  const delivered = jobs.filter(j=>j.status==='Delivered').length;
  const awaiting  = jobs.filter(j=>j.status.toLowerCase().includes('awaiting')).length;
  const cb        = jobs.filter(j=>j.comeBack==='Yes').length;
  const wip       = jobs.filter(j=>j.status==='WIP').length;
  document.getElementById('statsBar').innerHTML = `
    <div class="stat-card"><div class="stat-label">Total Jobs</div><div class="stat-value">${jobs.length}</div><div class="stat-sub">${active} active · ${delivered} delivered</div></div>
    <div class="stat-card"><div class="stat-label">WIP</div><div class="stat-value" style="color:#60a5fa">${wip}</div><div class="stat-sub">currently in progress</div></div>
    <div class="stat-card"><div class="stat-label">Awaiting Action</div><div class="stat-value" style="color:#fbbf24">${awaiting}</div><div class="stat-sub">approval, payment or parts</div></div>
    <div class="stat-card"><div class="stat-label">Come Backs</div><div class="stat-value" style="color:#ff6b6b">${cb}</div><div class="stat-sub">warranty / quality returns</div></div>
  `;
}

function renderTable() {
  const filtered = getFiltered();
  const overdue  = filtered.filter(isOverdue);
  const banner   = document.getElementById('overdueBanner');
  if (overdue.length) { banner.style.display='flex'; document.getElementById('overdueCount').textContent=overdue.length; }
  else banner.style.display='none';
  document.getElementById('jobCount').textContent = filtered.length;

  const tbody = document.getElementById('tableBody');
  if (!filtered.length) {
    tbody.innerHTML = `<tr><td colspan="10"><div class="empty-state"><h3>No jobs found</h3><p>Try adjusting your filters.</p></div></td></tr>`;
    return;
  }

  tbody.innerHTML = filtered.map(j => {
    const etd  = parseDate(j.carETD);
    const od   = isOverdue(j);
    const sc   = statusClass(j.status);
    const opts = STATUSES.map(s=>`<option value="${s}"${s===j.status?' selected':''}>${s}</option>`).join('');
    return `<tr class="${od?'overdue':''}" data-id="${j.id}">
      <td><select class="status-select ${sc}" onchange="updateStatus(${j.id},this.value)" style="background:transparent">${opts}</select></td>
      <td class="date-cell">${j.receivingDate ? fmtDate(parseDate(j.receivingDate)) : '—'}</td>
      <td><div class="customer-name">${j.name||'—'}</div><div class="customer-mobile">${j.mobile||''}</div></td>
      <td><div class="car-make">${j.make||''} ${j.model||''}</div><div class="car-plate">${j.plate&&j.plate!=='NA'?j.plate:''}</div></td>
      <td style="color:var(--muted);font-size:12px">${j.jobType||'—'}</td>
      <td><span class="center-name">${j.serviceCenter||'—'}</span></td>
      <td class="date-cell${od?' date-overdue':''}">${etd?fmtDate(etd):'—'}${od?' ⚠':''}</td>
      <td style="text-align:center">${j.comeBack==='Yes'?'⚠️':''}</td>
      <td><button class="action-btn" onclick="editJob(${j.id})">Edit</button></td>
    </tr>`;
  }).join('');
}

// ─── ACTIONS ─────────────────────────────────────────────────
async function updateStatus(id, val) {
  const j = jobs.find(x=>x.id===id);
  if (!j) return;
  j.status = val;
  renderStats(); renderTable();
  setSyncStatus('syncing','Saving...');
  try {
    await writeJobToSheet(j);
    setSyncStatus('live', `Saved · ${new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})}`);
    showToast('Status updated');
  } catch(e) { setSyncStatus('error','Save failed'); showToast('Save failed: '+e.message,'error'); }
}

function openModal(id=null) {
  editingId = id;
  document.getElementById('modalTitle').textContent = id ? '✦ Edit Job' : '✦ New Job';
  if (id) {
    const j = jobs.find(x=>x.id===id);
    document.getElementById('fStatus').value    = j.status||'';
    document.getElementById('fDate').value      = j.receivingDate ? toInputDate(parseDate(j.receivingDate)) : '';
    document.getElementById('fName').value      = j.name||'';
    document.getElementById('fMobile').value    = j.mobile||'';
    document.getElementById('fMake').value      = j.make||'';
    document.getElementById('fModel').value     = j.model||'';
    document.getElementById('fPlate').value     = j.plate||'';
    document.getElementById('fJobType').value   = j.jobType||'';
    document.getElementById('fCenter').value    = j.serviceCenter||'';
    document.getElementById('fPartsETA').value  = j.partsETA ? toInputDate(parseDate(j.partsETA)) : '';
    document.getElementById('fETD').value       = j.carETD ? toInputDate(parseDate(j.carETD)) : '';
    document.getElementById('fComeBack').value  = j.comeBack||'No';
  } else {
    ['fName','fMobile','fMake','fModel','fPlate','fPartsETA','fETD'].forEach(id=>document.getElementById(id).value='');
    document.getElementById('fDate').value   = new Date().toISOString().split('T')[0];
    document.getElementById('fStatus').value = 'Awaiting Approval';
    document.getElementById('fComeBack').value = 'No';
  }
  document.getElementById('modalOverlay').classList.add('open');
}

function editJob(id) { openModal(id); }
function closeModal() { document.getElementById('modalOverlay').classList.remove('open'); editingId=null; }

async function saveJob() {
  const btn = document.getElementById('saveBtn');
  btn.disabled = true; btn.textContent = 'Saving...';
  const data = {
    status:        document.getElementById('fStatus').value,
    receivingDate: fmtSheet(fromInputDate(document.getElementById('fDate').value)),
    name:          document.getElementById('fName').value,
    mobile:        document.getElementById('fMobile').value,
    make:          document.getElementById('fMake').value,
    model:         document.getElementById('fModel').value,
    plate:         document.getElementById('fPlate').value,
    jobType:       document.getElementById('fJobType').value,
    serviceCenter: document.getElementById('fCenter').value,
    partsETA:      fmtSheet(fromInputDate(document.getElementById('fPartsETA').value)),
    carETD:        fmtSheet(fromInputDate(document.getElementById('fETD').value)),
    comeBack:      document.getElementById('fComeBack').value,
  };
  try {
    if (editingId) {
      const idx = jobs.findIndex(j=>j.id===editingId);
      jobs[idx] = { ...jobs[idx], ...data };
      await writeJobToSheet(jobs[idx]);
      showToast('Job updated');
    } else {
      const newJob = { ...data, id: Date.now(), sheetRow: null };
      await sheetsAppend([buildRow(newJob)]);
      jobs.push(newJob);
      showToast('Job added to sheet');
    }
    closeModal(); renderStats(); renderTable();
    setSyncStatus('live', `Saved · ${new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})}`);
  } catch(e) {
    setSyncStatus('error','Save failed');
    showToast('Save failed: '+e.message,'error');
  }
  btn.disabled=false; btn.textContent='Save Job';
}

function buildRow(job) {
  const row = Array(TOTAL_COLS).fill('');
  Object.entries(COL).forEach(([k,i]) => { row[i] = job[k]!=null ? job[k] : ''; });
  return row;
}

function exportCSV() {
  const headers=['Status','Date In','Customer','Mobile','Make','Model','Plate','Job Type','Center','Parts ETA','Car ETD','Come Back'];
  const rows=jobs.map(j=>[j.status,j.receivingDate,j.name,j.mobile,j.make,j.model,j.plate,j.jobType,j.serviceCenter,j.partsETA,j.carETD,j.comeBack]);
  const csv=[headers,...rows].map(r=>r.map(v=>`"${(v||'').toString().replace(/"/g,'""')}"`).join(',')).join('\n');
  const a=document.createElement('a'); a.href='data:text/csv;charset=utf-8,'+encodeURIComponent(csv);
  a.download=`nexauto-jobs-${new Date().toISOString().split('T')[0]}.csv`; a.click();
}

document.getElementById('modalOverlay').addEventListener('click', e=>{ if(e.target===document.getElementById('modalOverlay'))closeModal(); });

// ─── INIT ─────────────────────────────────────────────────────
(async () => {
  document.getElementById('loadingText').textContent = 'Authenticating...';
  try {
    await getAccessToken();
    document.getElementById('loadingText').textContent = 'Loading jobs from Google Sheets...';
    await loadFromSheet();
    document.getElementById('loadingScreen').classList.add('hidden');
    document.getElementById('appShell').style.display = 'block';
  } catch(e) {
    document.getElementById('loadingText').textContent = '✕ Error: ' + e.message;
    console.error(e);
  }
})();
</script>
